name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # Never execute notebooks in CI: pages use the outputs saved in the
      # notebooks, and executing them would call paid APIs.
      - name: Render site
        run: quarto render --no-execute

      # A full render omits the OJS libraries (see TODO.md); rendering the
      # one page that uses OJS restores them.
      - name: Restore OJS resources
        run: quarto render evaluation/agreement.qmd --no-execute

      - name: Check output
        run: |
          test -f _site/index.html
          test -f _site/CNAME
          test -d _site/site_libs/quarto-ojs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Requires Settings > Pages > Source: "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Only one deployment at a time; never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
